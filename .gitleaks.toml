# Gitleaks Configuration for CloudGuard
title = "CloudGuard Gitleaks Secret Detection Rules"

[extend]
# Inherit default gitleaks rules

[[rules]]
description = "CloudGuard JWT Secret Key"
id = "cloudguard-jwt-secret"
regex = '''(?i)(?:jwt_secret_key|jwt_secret)\s*[:=]\s*["']?([a-zA-Z0-9_\-\.]{16,})["']?'''
secretGroup = 1
keywords = ["jwt_secret_key", "jwt_secret"]

[[rules]]
description = "Generic High-Entropy API Key"
id = "generic-api-key"
regex = '''(?i)(?:api_key|apikey|secret_key|app_secret)\s*[:=]\s*["']?([a-zA-Z0-9_\-\.]{20,})["']?'''
secretGroup = 1
keywords = ["api_key", "apikey", "secret_key"]

[[rules]]
description = "AWS Access Key ID"
id = "aws-access-key-id"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
keywords = ["AKIA", "ASIA"]

[[rules]]
description = "Anthropic API Key"
id = "anthropic-api-key"
regex = '''sk-ant-api[0-9]{2}-[a-zA-Z0-9_\-]{80,}'''
keywords = ["sk-ant-api"]

[allowlist]
description = "Allowlist for test fixtures and documentation"
paths = [
    '''backend/tests/.*''',
    '''\.env\.example$''',
    '''README\.md$''',
    '''implementation_plan\.md$''',
    '''walkthrough\.md$''',
    '''frontend/nginx\.conf$'''
]
regexes = [
    '''super-secret-jwt-key-for-test-environments-32bytes-min''',
    '''test-only-secret-not-for-production-DO-NOT-USE''',
    '''CHANGE-ME-BEFORE-PRODUCTION''',
    '''admin123'''
]
