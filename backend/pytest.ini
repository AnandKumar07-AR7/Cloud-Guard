[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=core
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (may require AWS or DB)
    demo: Tests that use demo mode fixtures
    aws: Tests that require real AWS credentials
